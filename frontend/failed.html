<script>
  (async function () {
    const reference = window.DataInnResult.getReference();
    const shell = document.getElementById('result-shell');

    if (!reference) {
      shell.innerHTML = '<div class="empty-state">No order reference was given.</div>';
      return;
    }

    function render({ heading, message, pillClass, pillLabel, showReference }) {
      shell.innerHTML = `
        <div class="result-icon error" aria-hidden="true">!</div>
        <h1>${heading}</h1>
        ${pillLabel ? `<p class="pill ${pillClass}" style="margin-bottom: 8px;"><span class="dot"></span>${pillLabel}</p>` : ''}
        <p class="muted">${message}</p>
        ${showReference ? `<div class="result-summary review-list"><div class="review-row"><span class="label">Order</span><span class="value">${reference}</span></div></div>` : ''}
        <div class="result-actions">
          <a href="buy.html" class="btn btn-primary btn-block">Try again</a>
          <a href="index.html" class="btn btn-secondary btn-block">Return home</a>
        </div>
      `;
    }

    try {
      const { order } = await window.DataInnAPI.getOrder(reference);

      if (order.deliveryStatus === 'delivered') {
        window.location.href = `success.html?ref=${encodeURIComponent(reference)}`;
        return;
      }

      if (order.paymentStatus === 'failed' || order.paymentStatus === 'cancelled') {
        render({
          heading: 'Payment did not go through',
          message: "Your payment could not be completed, so no data was sent. You have not been charged — feel free to try again.",
          pillClass: 'pill-danger',
          pillLabel: 'Payment failed',
          showReference: false,
        });
      } else if (['refunded', 'refund_processing'].includes(order.deliveryStatus)) {
        render({
          heading: 'Order refunded',
          message: "We couldn't complete the data delivery. Your payment is being reviewed and refunded where applicable — this can take a short while to reflect.",
          pillClass: 'pill-neutral',
          pillLabel: 'Refunded',
          showReference: true,
        });
      } else if (order.deliveryStatus === 'failed') {
        render({
          heading: "We couldn't complete delivery",
          message: "We couldn't complete the data delivery. Your payment is being reviewed and refunded where applicable.",
          pillClass: 'pill-danger',
          pillLabel: 'Delivery failed',
          showReference: true,
        });
      } else {
        render({
          heading: 'Still processing',
          message: "This order hasn't finished processing yet. Refresh in a moment to see its latest status.",
          pillClass: 'pill-info',
          pillLabel: 'Processing',
          showReference: true,
        });
      }
    } catch (err) {
      render({
        heading: 'Something went wrong',
        message: err.message || "We couldn't load this order. If you were charged, contact support with your order reference.",
        pillClass: '',
        pillLabel: '',
        showReference: true,
      });
    }
  })();
</script>
