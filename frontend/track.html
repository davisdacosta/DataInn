<script src="js/theme.js"></script>
<script>
  document.getElementById('form-track').addEventListener('submit', function (e) {
    e.preventDefault();
    const input = document.getElementById('input-reference');
    const error = document.getElementById('error-reference');
    const value = input.value.trim();
    const valid = value.length > 0;
    input.classList.toggle('has-error', !valid);
    error.classList.toggle('visible', !valid);
    if (!valid) return;
    window.location.href = 'success.html?ref=' + encodeURIComponent(value);
  });
</script>
